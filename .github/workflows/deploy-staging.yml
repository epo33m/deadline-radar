name: Staging Migration & Deploy

# Staging follows main's pull requests (trunk-based): every PR toward main
# applies pending migrations to the staging database, so the change is
# verifiable on staging DURING review — before it can reach production.
# The post-merge push re-runs idempotently (`migration up` is a no-op when
# there is nothing pending), which also covers direct pushes to main.
# Manual dry-runs remain available via workflow_dispatch.
# Reads ONLY staging secrets — never production.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list pending migrations without applying)"
        required: true
        type: boolean
        default: false

jobs:
  migrate_staging:
    name: Apply Staging Migrations
    runs-on: ubuntu-latest
    # Runs under the `staging` GitHub environment (secrets scoped to staging).
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Migration Status
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          supabase migration list --db-url "$DATABASE_URL"

      - name: Apply Migrations
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          supabase migration up --db-url "$DATABASE_URL"
          supabase migration list --db-url "$DATABASE_URL"
